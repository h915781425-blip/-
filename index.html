<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>免佣百家乐/幸运六正式版</title>
  <script src="https://registry.npmmirror.com/vue/3.3.4/files/dist/vue.global.prod.js"></script>
  
  <style>
    [v-cloak] { display: none !important; }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { background-color: #0b1c14; height: 100%; width: 100%; overflow: hidden; position: fixed; }

    .table-container { 
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle, #2E8B57 0%, #0B3B17 100%);
      display: flex; flex-direction: column; color: white; overflow: hidden;
      padding-top: max(1vh, env(safe-area-inset-top, 10px));
    }

    .top-bar { flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; padding: 1vh 4vw; font-size: 3.5vw; color: #FFD700; background: rgba(0,0,0,0.4); }
    .mode-switcher-bar { flex-shrink: 0; display: flex; padding: 0.5vh 2vw; }
    .mode-tab { flex: 1; text-align: center; font-size: 2.8vw; padding: 0.8vh 0; color: #aaa; background: #222; border: 1px solid #444; }
    .tab-active-free { background: #FFD700; color: #000; font-weight: 900; }
    
    /* 【核心修复】发牌区强制拉高优先级，路单区强制缩紧 */
    .card-display-area {
      flex: 2; /* 给予牌桌区更多空间 */
      display: flex; justify-content: space-between;
      margin: 0.5vh 2vw; padding: 0.5vh 2vw; background: rgba(0,0,0,0.3);
      border: 1px solid #FFD700; border-radius: 1.5vw;
    }
    .cards-side { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .card-slots { display: flex; gap: 1vw; }
    .card-slot { width: 9vw; height: 12vw; border: 1px dashed rgba(255,255,255,0.3); border-radius: 1vw; }

    /* 路单区：改为极度紧凑的固定高度 */
    .macau-roads-panel-clean {
      flex-shrink: 0; height: 18vh; margin: 0 2vw; background: #fff; border: 1px solid #FFD700; border-radius: 1vw; overflow: hidden;
    }
    .roads-scroll-view { width: 100%; height: 100%; overflow-x: auto; }
    .bead-row-container, .bigroad-row-container { height: 70px; display: flex; }
    
    .road-intelligence-mega-deck {
      flex-shrink: 0; margin: 0.5vh 2vw; height: 4vh; background: rgba(0,0,0,0.8); border: 1px solid #FFD700; border-radius: 1vw; display: flex; align-items: center; padding: 0 2vw;
    }
    .tips-text-pro { font-size: 2.8vw; color: #fff; white-space: nowrap; }

    .bottom-control-deck { flex-shrink: 0; padding-bottom: max(1vh, env(safe-area-inset-bottom, 10px)); }
    .classic-betting-grid { display: flex; padding: 0.5vh 2vw; gap: 2vw; }
    .classic-zone { flex: 1; height: 10vw; border: 1px solid #FFD700; border-radius: 1vw; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
    .cz-t { font-size: 2.8vw; }
    .cz-a { position: absolute; background: #FFD700; color: #000; font-size: 2.5vw; padding: 0 1vw; top: -1vh; border-radius: 1vw; }

    .lucky6-premium-bar { display: flex; padding: 0 2vw; gap: 2vw; margin-top: 0.5vh; }
    .l6-zone { flex: 1; height: 8vw; border: 1px solid #FFD700; border-radius: 1vw; display: flex; flex-direction: column; justify-content: center; align-items: center; }

    .deck-chips-isolated-row { padding: 0.5vh 2vw; }
    .chips-flex-box { display: flex; justify-content: space-between; }
    .dg-chip { width: 10vw; height: 10vw; border-radius: 50%; background: #d4af37; display: flex; justify-content: center; align-items: center; font-size: 2.8vw; }
    
    .deck-ops-action-bar { padding: 0 2vw; display: flex; gap: 2vw; margin-top: 0.5vh; }
    .main-deal-button { flex: 1; background: #FFD700; border: none; padding: 1.2vh 0; border-radius: 1vw; font-weight: bold; }
  </style>
</head>
<body>
  <div id="app" class="table-container" v-cloak>
    <div class="top-bar">
      <span>余额: ¥{{balance}}</span>
      <button @click="recharge">➕充值</button>
    </div>
    <div class="mode-switcher-bar">
      <div class="mode-tab" :class="{'tab-active-std': gameMode === 'standard'}" @click="switchMode('standard')">标准</div>
      <div class="mode-tab" :class="{'tab-active-free': gameMode === 'free'}" @click="switchMode('free')">免佣</div>
    </div>
    <div class="card-display-area">
      <div class="cards-side">
        <div class="side-title player-color">闲 PLAYER [{{playerPoint}}]</div>
        <div class="card-slots"><div class="card-slot"></div><div class="card-slot"></div><div class="card-slot"></div></div>
      </div>
      <div class="cards-side">
        <div class="side-title banker-color">庄 BANKER [{{bankerPoint}}]</div>
        <div class="card-slots"><div class="card-slot"></div><div class="card-slot"></div><div class="card-slot"></div></div>
      </div>
    </div>
    <div class="macau-roads-panel-clean">
      <div class="roads-scroll-view"><div class="roads-scroll-content">...</div></div>
    </div>
    <div class="road-intelligence-mega-deck"><span class="tips-text-pro">{{roadTrendTip}}</span></div>
    <div class="bottom-control-deck">
      <div class="classic-betting-grid">
        <div class="classic-zone" @click="placeBet('player')">闲</div>
        <div class="classic-zone" @click="placeBet('tie')">和</div>
        <div class="classic-zone" @click="placeBet('banker')">庄</div>
      </div>
      <div class="deck-chips-isolated-row">...</div>
      <div class="deck-ops-action-bar"><button class="main-deal-button" @click="dealCards">开 始 发 牌</button></div>
    </div>
  </div>
  <script>/* 此处保持之前的JS逻辑不变 */</script>
</body>
</html>
